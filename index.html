<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Live Übersetzer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="preconnect" href="https://api.mymemory.translated.net" crossorigin>
<link rel="preconnect" href="https://translation.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #f5f7fa; --card: #ffffff; --text: #334260; --strong: #1d2a44;
    --muted: #7a8599; --border: #e4e8ef; --blue: #1073e6; --blue-soft: rgba(16,115,230,.1);
    --red: #ef4d5d; --red-dark: #d93446; --red-ring: rgba(239,77,93,.14);
    --shadow: 0 2px 8px rgba(29,42,68,.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141d; --surface: #171e2a; --card: #1c2433; --text: #c9d2e3; --strong: #f1f4fa;
      --muted: #8591a7; --border: #273044; --blue: #4d9bff; --blue-soft: rgba(77,155,255,.14);
      --red-ring: rgba(239,77,93,.2); --shadow: 0 2px 8px rgba(0,0,0,.35); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141d; --surface: #171e2a; --card: #1c2433; --text: #c9d2e3; --strong: #f1f4fa;
    --muted: #8591a7; --border: #273044; --blue: #4d9bff; --blue-soft: rgba(77,155,255,.14);
    --red-ring: rgba(239,77,93,.2); --shadow: 0 2px 8px rgba(0,0,0,.35); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 500 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; padding-bottom: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--strong); }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); display: grid; place-items: center; padding: 0;
  }
  .round:hover { border-color: var(--muted); }
  .round svg { width: 20px; height: 20px; }

  /* Hero */
  .hero { text-align: center; padding: 10px 0 18px; }
  .hero h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); font-weight: 500; color: var(--strong); letter-spacing: -.01em; }
  .hero p { margin: 6px 0 0; color: var(--muted); font-size: clamp(14px, 2.6vw, 17px); }
  body.has-lines .hero { display: none; }

  /* Segmented control */
  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px; gap: 4px;
  }
  .seg button {
    flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 8px 6px;
    color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px;
  }
  .seg button svg { width: 17px; height: 17px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--blue); box-shadow: var(--shadow); }

  /* Language row */
  .langs { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .lang {
    flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 20px; height: 56px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--strong); font-size: 16px;
  }
  .lang .flag { width: 26px; height: 18px; border-radius: 4px; flex: none; box-shadow: 0 0 0 1px var(--border); }
  .lang small { margin-left: auto; color: var(--muted); font-size: 12px; }
  .flags { display: inline-flex; }
  .flags > span { display: inline-flex; }
  body[data-variant="GB"] .f-us, body[data-variant="US"] .f-gb { display: none; }
  .variant { margin-left: auto; display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
  .variant button { border: 0; background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .variant button[aria-pressed="true"] { background: var(--card); color: var(--blue); box-shadow: var(--shadow); }
  .pane .variant { background: var(--card); }
  .pane .variant button[aria-pressed="true"] { background: var(--blue-soft); box-shadow: none; }
  .arrow { width: 56px; height: 56px; flex: none; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
  .arrow svg { width: 18px; height: 18px; }

  /* Option row */
  .opts { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; color: var(--strong); flex-wrap: wrap; }
  .sizes { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .sizes button { border: 0; background: transparent; border-radius: 999px; width: 38px; height: 30px; color: var(--muted); font-weight: 600; padding: 0; }
  .sizes button[aria-pressed="true"] { background: var(--card); color: var(--blue); box-shadow: var(--shadow); }

  /* Split panes: German (live) | English — stacked on phones */
  main.wrap { max-width: 1400px; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 14px; }
  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  body[data-mode="de"] #paneEn, body[data-mode="en"] #paneDe { display: none; }
  body:not([data-mode="both"]) .panes { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .pane { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 14px 22px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .pane-head .flag { width: 20px; height: 14px; border-radius: 3px; box-shadow: 0 0 0 1px var(--border); }
  .live-tag { margin-left: auto; display: none; align-items: center; gap: 6px; color: var(--red); }
  .live-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
  body.listening .live-tag { display: inline-flex; }
  @keyframes blink { 50% { opacity: .25; } }
  .pane-body { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .pane-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 18px; -webkit-overflow-scrolling: touch; }
  .pane-body:empty::before { content: attr(data-placeholder); color: var(--muted); font-size: 15px; }
  .s { margin: 0 0 .7em; font-size: var(--size, 22px); line-height: 1.45; color: var(--strong); font-weight: 500; }
  #feedDe .s { font-size: calc(var(--size, 22px) * .8); }
  #feedDe .s.live { color: var(--blue); }
  /* Translation is what you read — give it the larger share of the space. */
  body[data-mode="both"] .panes { grid-template-columns: 2fr 3fr; }
  #feedEn .s.pending { color: var(--muted); }
  #feedEn .s:empty { display: none; }
  .note { margin: 0 0 10px; padding: 10px 14px; border-radius: 14px; background: var(--red-ring); color: var(--strong); font-size: 14px; display: none; }
  body.has-lines .langs { display: none; }
  /* Before captions start, the intro can push the page taller than the screen — let it scroll instead of crushing the panes. */
  body:not(.has-lines) { height: auto; min-height: 100dvh; }
  body:not(.has-lines) .panes { min-height: 260px; }

  /* Once captions are showing, collapse the header and dock to give the panes the room. */
  body.has-lines .dock { padding-top: 2px; }
  body.has-lines .bubble { margin-bottom: 6px; padding: 3px 12px; font-size: 13px; }
  @media (min-width: 701px) {
    /* Status sits beside the mic instead of above it. */
    body.has-lines .bubble { grid-column: 1; grid-row: 1; justify-self: end; margin: 0 22px 0 0; padding: 4px 12px; }
    body.has-lines .bubble::after { left: auto; right: -6px; bottom: auto; top: 50%; transform: translateY(-50%); border: 6px solid transparent; border-right: 0; border-left-color: var(--surface); }
    body.has-lines .side:not(.right) { grid-column: 1; grid-row: 1; }
  }
  body.has-lines .mic { width: 72px; height: 72px; box-shadow: 0 0 0 7px var(--red-ring), 0 4px 12px rgba(217,52,70,.3); }
  body.has-lines .mic svg { width: 30px; height: 30px; }
  body.has-lines .mic.on .i-stop { width: 24px; height: 24px; }
  body.has-lines .meta { margin-top: 8px; }
  body.has-lines main { margin-top: 10px; }
  @media (min-width: 701px) {
    body.has-lines header.wrap { max-width: 1400px; display: flex; align-items: center; gap: 16px; padding-top: 10px; }
    body.has-lines .topbar { display: contents; }
    body.has-lines .seg { order: 2; flex: 0 1 420px; margin-left: auto; padding: 3px; }
    body.has-lines .seg button { flex-direction: row; justify-content: center; gap: 6px; padding: 6px 10px; font-size: 14px; }
    body.has-lines .opts { order: 3; margin: 0; }
    body.has-lines .opts > span { display: none; }
    body.has-lines #settings { order: 4; }
  }

  @media (max-width: 700px) {
    body[data-mode="both"] .panes { grid-template-columns: 1fr; grid-template-rows: 2fr 3fr; gap: 10px; }
    body.has-lines header.wrap { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    body.has-lines .topbar { grid-column: 1 / -1; padding-top: 10px; padding-bottom: 0; }
    body.has-lines .seg { padding: 3px; }
    body.has-lines .opts { margin: 0; }
    body.has-lines .opts > span { display: none; }
    body.has-lines .sizes button { width: 30px; }
    body.has-lines[data-mode="talk"] .seg, body.has-lines[data-mode="talk"] .opts { grid-column: 1 / -1; }
    .s { font-size: calc(var(--size, 22px) * .85); }
    body.has-lines .seg button svg { display: none; }
    body.has-lines .seg button { padding: 6px 2px; font-size: 13px; }
  }

  /* Two-way conversation */
  body[data-mode="talk"] .panes { display: none; }
  .chat { display: none; flex: 1; min-height: 0; overflow-y: auto; flex-direction: column; gap: 12px; padding: 4px 2px 12px; }
  body[data-mode="talk"] .chat { display: flex; }
  .chat:empty::before { content: attr(data-placeholder); margin: auto; max-width: 360px; text-align: center; color: var(--muted); }
  .msg { max-width: min(82%, 640px); padding: 10px 16px 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); }
  .msg.de { align-self: flex-start; border-bottom-left-radius: 6px; }
  .msg.en { align-self: flex-end; background: var(--blue-soft); border-color: rgba(16,115,230,.25); border-bottom-right-radius: 6px; }
  .who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .who .flag { width: 18px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px var(--border); }
  .replay { margin-left: auto; border: 0; background: transparent; color: var(--muted); padding: 2px; display: grid; }
  .replay svg { width: 16px; height: 16px; }
  .replay:hover { color: var(--blue); }
  .msg .tr { font-size: var(--size, 22px); line-height: 1.4; font-weight: 600; color: var(--strong); }
  .msg .tr:empty { display: none; }
  .msg .orig { font-size: calc(var(--size, 22px) * .68); color: var(--muted); margin-top: 4px; }
  .msg.live .orig { color: var(--blue); }
  .msg.pending .tr { color: var(--muted); }
  .arrow .i-two, body[data-mode="talk"] .arrow .i-one { display: none; }
  body[data-mode="talk"] .arrow .i-two { display: block; }
  .speak { display: none; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .speak svg { width: 16px; height: 16px; }
  .speak[aria-pressed="true"] { color: var(--blue); background: var(--blue-soft); border-color: transparent; }
  body[data-mode="talk"] .speak { display: inline-flex; }
  .opts { gap: 10px; }
  .opts .grow { flex: 1; }

  .talk-mics { display: none; gap: 28px; align-items: flex-end; }
  body[data-mode="talk"] #toggle { display: none; }
  body[data-mode="talk"] .talk-mics { display: flex; }
  .tmic { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; color: var(--strong); font-size: 13px; font-weight: 600; }
  .tmic .disc { position: relative; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: linear-gradient(180deg, var(--red), var(--red-dark)); box-shadow: 0 0 0 8px var(--red-ring); transition: transform .15s; }
  .tmic.en .disc { background: linear-gradient(180deg, #2b8af0, #1060c9); box-shadow: 0 0 0 8px var(--blue-soft); }
  .tmic:hover .disc { transform: scale(1.04); }
  .tmic .disc > svg { width: 30px; height: 30px; }
  .tmic .badge { position: absolute; right: -2px; bottom: -2px; display: flex; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 2px var(--bg); }
  .tmic .badge .flag { width: 24px; height: 16px; display: block; }
  .tmic.on .disc { animation: ring 1.6s ease-out infinite; }
  .tmic.en.on .disc { animation-name: ring-blue; }
  .tmic:disabled { opacity: .4; cursor: not-allowed; }
  @keyframes ring-blue {
    0% { box-shadow: 0 0 0 0 rgba(16,115,230,.45); }
    100% { box-shadow: 0 0 0 22px rgba(16,115,230,0); }
  }
  body.has-lines .tmic .disc { width: 64px; height: 64px; }
  body.has-lines .tmic .disc > svg { width: 26px; height: 26px; }

  /* Bottom dock */
  .dock { padding-top: 6px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .side { display: flex; gap: 10px; }
  .side.right { justify-content: flex-end; }
  .bubble {
    justify-self: center; grid-column: 1 / -1; margin-bottom: 10px; padding: 6px 14px; border-radius: 999px;
    background: var(--surface); color: var(--blue); font-size: 15px; position: relative; font-variant-numeric: tabular-nums;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border: 6px solid transparent; border-bottom: 0; border-top-color: var(--surface);
  }
  .mic {
    width: 100px; height: 100px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
    background: linear-gradient(180deg, var(--red), var(--red-dark)); color: #fff;
    box-shadow: 0 0 0 10px var(--red-ring), 0 6px 18px rgba(217,52,70,.3); transition: transform .15s;
  }
  .mic:hover { transform: scale(1.03); }
  .mic:disabled { opacity: .4; cursor: not-allowed; }
  .mic svg { width: 40px; height: 40px; }
  .mic .i-stop { display: none; }
  .mic.on .i-mic { display: none; }
  .mic.on .i-stop { display: block; width: 30px; height: 30px; }
  .mic.on { animation: ring 1.6s ease-out infinite; }
  @keyframes ring {
    0% { box-shadow: 0 0 0 0 rgba(239,77,93,.45), 0 6px 18px rgba(217,52,70,.3); }
    100% { box-shadow: 0 0 0 22px rgba(239,77,93,0), 0 6px 18px rgba(217,52,70,.3); }
  }
  .meta { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; }

  /* Settings dialog */
  dialog { border: 1px solid var(--border); border-radius: 20px; background: var(--card); color: var(--text); width: min(460px, calc(100vw - 32px)); padding: 22px; }
  dialog::backdrop { background: rgba(15,20,29,.45); }
  dialog h2 { font-size: 19px; font-weight: 600; margin: 0 0 14px; color: var(--strong); }
  dialog label { display: block; margin-bottom: 14px; font-size: 14px; color: var(--strong); }
  dialog small { color: var(--muted); font-weight: 400; }
  dialog input { display: block; width: 100%; margin-top: 6px; font: inherit; padding: 11px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--strong); }
  dialog input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { border-radius: 999px; padding: 10px 22px; border: 1px solid var(--border); background: var(--card); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }

  @media (max-width: 480px) {
    .seg button { font-size: 13px; }
    .lang { height: 48px; padding: 0 14px; font-size: 15px; }
    .arrow { width: 44px; height: 44px; }
    .mic { width: 84px; height: 84px; }
    .round { width: 40px; height: 40px; }
  }
</style>
</head>
<body data-mode="both" data-variant="GB">
<header class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1073e6"/><stop offset="1" stop-color="#ef4d5d"/></linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#lg)"/>
        <path d="M9 13v6M13 10v12M17 12v8M21 9v14M25 14v4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      Live Übersetzer
    </div>
    <button class="round" id="settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <div class="hero">
    <h1>Live Translate</h1>
    <p>Real-time English captions for German lectures, conferences and conversations.</p>
  </div>

  <div class="seg" id="mode" role="group" aria-label="Caption mode">
    <button data-mode="de" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h10M4 18h13"/></svg>Transcribe</button>
    <button data-mode="en" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8.5 3v2M11 5c-.8 3.6-3.2 6.6-6.5 8.5M6 8.5c1.2 2 3 3.6 5 4.5M12.5 21l4-10 4 10M14 17h5"/></svg>Translate</button>
    <button data-mode="both" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10h10M7 14h6"/></svg>Both</button>
    <button data-mode="talk" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h11v7H8l-3 3v-3H3z"/><path d="M10 15v2h6l3 3v-3h2v-7h-4"/></svg>Talk</button>
  </div>

  <div class="langs">
    <div class="lang"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="7" fill="#000"/><rect y="6.6" width="30" height="6.8" fill="#dd0000"/><rect y="13.3" width="30" height="6.7" fill="#ffce00"/></svg>German<small>Speaker</small></div>
    <div class="arrow" aria-hidden="true">
      <svg class="i-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <svg class="i-two" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></svg>
    </div>
    <div class="lang"><span class="flags"><span class="f-gb"><svg class="flag" viewBox="0 0 60 30" aria-hidden="true"><clipPath id="gbc"><path d="M0 0v30h60V0z"/></clipPath><g clip-path="url(#gbc)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" stroke="#C8102E" stroke-width="3"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg></span><span class="f-us"><svg class="flag" viewBox="0 0 38 20" aria-hidden="true"><rect width="38" height="20" fill="#b22234"/><path d="M0 2.3h38M0 5.4h38M0 8.5h38M0 11.5h38M0 14.6h38M0 17.7h38" stroke="#fff" stroke-width="1.55"/><rect width="15.2" height="10.8" fill="#3c3b6e"/></svg></span></span>English<span class="variant" role="group" aria-label="English variant"><button data-v="GB" aria-pressed="true">UK</button><button data-v="US" aria-pressed="false">US</button></span></div>
  </div>

  <div class="opts">
    <span>Text size</span>
    <span class="grow"></span>

<dialog id="dlg">
  <form method="dialog">
    <h2>Translation settings</h2>
    <label>Google Translate API key <small>— recommended for long classes; the free tier covers ~500,000 characters/month</small>
      <input id="gkey" type="password" autocomplete="off" placeholder="AIza…"></label>
    <label>Email for MyMemory <small>— used when no key is set; raises the free limit from 5,000 to 50,000 characters/day</small>
      <input id="email" type="email" autocomplete="off" placeholder="you@example.com"></label>
    <p><small>Saved only in this browser.</small></p>
    <div class="row"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="save">Save</button></div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isAndroid = /Android/i.test(navigator.userAgent);
const store = {
  get(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let quotaEmail = store.get('lt-email'), googleKey = store.get('lt-gkey');

let listening = false, rec = null, liveEl = null, liveTimer = null;
let translator = null, engine = 'mymemory';
const translators = {}; // Chrome on-device translators by pair, e.g. 'de-en'
const history = []; // {de, en, time}
let variant = store.get('lt-variant', 'GB'); // 'GB' | 'US'

function note(msg) { $('note').innerHTML = msg; $('note').style.display = msg ? 'block' : 'none'; }
function setStatus(t) { $('statusText').textContent = t; }

// ---------- Translation ----------
// Prefer Chrome's built-in on-device Translator (fast, free, unlimited);
// fall back to the MyMemory web API (free, ~5000 chars/day).
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

// fromGesture: creating a translator that needs a download requires a user click.
async function initTranslator(fromGesture = false) {
  if ('Translator' in self) {
    for (const [from, to] of [['de', 'en'], ['en', 'de']]) {
      const pair = `${from}-${to}`;
      if (translators[pair]) continue;
      try {
        const avail = await withTimeout(Translator.availability({ sourceLanguage: from, targetLanguage: to }), 3000);
        if (avail === 'available' || (fromGesture && avail !== 'unavailable')) {
          translators[pair] = await Translator.create({
            sourceLanguage: from, targetLanguage: to,
            monitor(m) { m.addEventListener('downloadprogress', e => setStatus(`Downloading language pack ${Math.round(e.loaded * 100)}%`)); }
          });
        }
      } catch (e) { console.warn(`Built-in ${pair} translator unavailable:`, e); }
    }
    translator = translators['de-en'] || null;
    if (translator) engine = 'builtin';
  }
  showEngine();
}

// ---------- Usage meter ----------
// Online engines have free quotas; track what we send so the user knows how long they can keep going.
const CHARS_PER_MIN = 850; // typical German speech: ~130 words/min
let usage = {};
try { usage = JSON.parse(store.get('lt-usage', '{}')); } catch {}
function addUsage(n) {
  const day = new Date().toISOString().slice(0, 10), month = day.slice(0, 7);
  if (usage.day !== day) { usage.day = day; usage.mm = 0; }
  if (usage.month !== month) { usage.month = month; usage.g = 0; }
  if (googleKey) usage.g = (usage.g || 0) + n; else usage.mm = (usage.mm || 0) + n;
  store.set('lt-usage', JSON.stringify(usage));
  showEngine();
}
function quota() {
  const day = new Date().toISOString().slice(0, 10), month = day.slice(0, 7);
  if (googleKey) return { used: usage.month === month ? usage.g || 0 : 0, limit: 500000, per: 'this month' };
  return { used: usage.day === day ? usage.mm || 0 : 0, limit: quotaEmail ? 50000 : 5000, per: 'today' };
}
const fmtNum = n => n >= 10000 ? Math.round(n / 1000) + 'k' : n.toLocaleString('en');
function showEngine() {
  if (engine === 'builtin') { $('engine').textContent = 'Chrome on-device translator · no limit'; return; }
  const q = quota();
  const left = Math.max(0, q.limit - q.used);
  const mins = Math.floor(left / CHARS_PER_MIN);
  const time = mins >= 120 ? `~${Math.floor(mins / 60)} h` : `~${mins} min`;
  $('engine').textContent = `${googleKey ? 'Google' : 'MyMemory'} · ${fmtNum(q.used)} / ${fmtNum(q.limit)} characters ${q.per} · ${time} of speech left`
    + (googleKey || quotaEmail ? '' : ' (raise it in Settings)');
}

const cache = new Map();
async function translateRaw(text, from = 'de', to = 'en') {
  text = text.trim();
  if (!text) return '';
  const key = `${from}>${to}|${variant}|${text}`;
  if (cache.has(key)) return cache.get(key);
  let out;
  const local = translators[`${from}-${to}`];
  if (local) {
    out = await local.translate(text);
  } else if (googleKey) {
    addUsage(text.length);
    const r = await fetch('https://translation.googleapis.com/language/translate/v2?key=' + encodeURIComponent(googleKey), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text, source: from, target: to, format: 'text' }),
    });
    const j = await r.json();
    if (j.error) throw new Error('Google: ' + j.error.message);
    out = j.data.translations[0].translatedText;
  } else {
    addUsage(text.length);
    const pair = from === 'de' ? `de|en-${variant}` : `en-${variant}|de`;
    const url = `https://api.mymemory.translated.net/get?langpair=${pair}&q=` + encodeURIComponent(text.slice(0, 480))
      + (quotaEmail ? '&de=' + encodeURIComponent(quotaEmail) : '');
    const r = await fetch(url);
    const j = await r.json();
    if (j.quotaFinished) throw new Error('Daily free translation limit reached — add a Google key in Settings');
    if (j.responseStatus != 200) throw new Error(j.responseDetails || 'Translation failed');
    out = j.responseData.translatedText;
  }
  cache.set(key, out);
  return out;
}

const translate = async text => toVariant(await translateRaw(text), variant);

// ---------- UK / US English ----------
// Google and Chrome's translator only output generic (mostly US) English, so normalise spelling
// and a few unambiguous words to the chosen variant.
const EN_PAIRS = (() => {
  const us2uk = {
    color: 'colour', colors: 'colours', colored: 'coloured', colorful: 'colourful',
    favor: 'favour', favors: 'favours', favorite: 'favourite', favorites: 'favourites', favorable: 'favourable',
    behavior: 'behaviour', behaviors: 'behaviours', behavioral: 'behavioural',
    honor: 'honour', honors: 'honours', honored: 'honoured', labor: 'labour', neighbor: 'neighbour', neighbors: 'neighbours',
    neighborhood: 'neighbourhood', humor: 'humour', flavor: 'flavour', flavors: 'flavours', rumor: 'rumour', harbor: 'harbour',
    center: 'centre', centers: 'centres', centered: 'centred', theater: 'theatre', theaters: 'theatres',
    fiber: 'fibre', liter: 'litre', liters: 'litres', gray: 'grey',
    analyze: 'analyse', analyzes: 'analyses', analyzed: 'analysed', analyzing: 'analysing', paralyze: 'paralyse', paralyzed: 'paralysed',
    catalog: 'catalogue', defense: 'defence', offense: 'offence',
    traveling: 'travelling', traveled: 'travelled', traveler: 'traveller', travelers: 'travellers',
    canceled: 'cancelled', canceling: 'cancelling', modeling: 'modelling', labeled: 'labelled', labeling: 'labelling',
    fulfill: 'fulfil', enroll: 'enrol', enrollment: 'enrolment', skillful: 'skilful', aging: 'ageing',
    mom: 'mum', jewelry: 'jewellery', pajamas: 'pyjamas', aluminum: 'aluminium', mold: 'mould', cozy: 'cosy',
    pediatric: 'paediatric', anemia: 'anaemia', anesthesia: 'anaesthesia', maneuver: 'manoeuvre',
    edema: 'oedema', estrogen: 'oestrogen', fetus: 'foetus', leukemia: 'leukaemia', orthopedic: 'orthopaedic',
  };
  const stems = ['organ', 'real', 'recogn', 'apolog', 'emphas', 'critic', 'summar', 'priorit', 'minim', 'maxim',
    'special', 'optim', 'categor', 'memor', 'final', 'util', 'standard', 'custom', 'visual', 'character',
    'normal', 'general', 'global', 'modern', 'mobil', 'stabil', 'sympath', 'author', 'civil', 'synchron', 'hospital'];
  for (const st of stems) {
    for (const [a, b] of [['ize', 'ise'], ['izes', 'ises'], ['ized', 'ised'], ['izing', 'ising'], ['ization', 'isation'], ['izations', 'isations'], ['izer', 'iser']]) {
      us2uk[st + a] = st + b;
    }
  }
  const uk2us = Object.fromEntries(Object.entries(us2uk).map(([a, b]) => [b, a]));
  // Vocabulary: only swaps that stay correct regardless of context.
  const phrasesToUK = [['cell phones', 'mobile phones'], ['cell phone', 'mobile phone'], ['zip code', 'postcode'],
    ['movie theater', 'cinema'], ['an apartment', 'a flat'], ['an elevator', 'a lift'], ['apartments', 'flats'], ['apartment', 'flat'], ['elevators', 'lifts'], ['elevator', 'lift'],
    ['sidewalk', 'pavement'], ['garbage', 'rubbish'], ['math', 'maths'], ['soccer', 'football'], ['vacation', 'holiday']];
  const phrasesToUS = [['mobile phones', 'cell phones'], ['mobile phone', 'cell phone'], ['postcode', 'zip code'], ['cinema', 'movie theater'], ['maths', 'math']];
  return { GB: { words: us2uk, phrases: phrasesToUK }, US: { words: uk2us, phrases: phrasesToUS } };
})();

function matchCase(src, dst) {
  if (src === src.toUpperCase() && src.length > 1) return dst.toUpperCase();
  if (src[0] === src[0].toUpperCase()) return dst[0].toUpperCase() + dst.slice(1);
  return dst;
}
function toVariant(text, v) {
  const t = EN_PAIRS[v];
  if (!t || !text) return text;
  for (const [from, to] of t.phrases) {
    text = text.replace(new RegExp(`\\b${from}\\b`, 'gi'), m => matchCase(m, to));
  }
  return text.replace(/\b[A-Za-z]+\b/g, w => { const r = t.words[w.toLowerCase()]; return r ? matchCase(w, r) : w; });
}

function setVariant(v) {
  variant = v;
  document.body.dataset.variant = v;
  document.querySelectorAll('.variant button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  // Convert what's already on screen.
  for (const m of chat) {
    if (m.from !== 'de' || !m.raw) continue;
    m.tr = toVariant(m.raw, v);
    const el = chatEls.get(m);
    if (el) el.tr.textContent = m.tr;
  }
  if (chat.length) saveChat();
  const lines = $('feedEn').children;
  history.forEach((h, i) => {
    if (!h.en) return;
    h.en = toVariant(h.raw || h.en, v);
    if (lines[i]) lines[i].textContent = h.en;
  });
  saveHistory();
}

// ---------- Transcript ----------
function saveHistory() {
  $('count').textContent = history.length ? `· ${history.length} sentence${history.length === 1 ? '' : 's'}` : '';
  updateHasLines();
  store.set('lt-history', JSON.stringify(history));
}
function restoreHistory() {
  let saved = [];
  try { saved = JSON.parse(store.get('lt-history', '[]')); } catch {}
  for (const h of saved) {
    const line = makeLine();
    line.de.className = line.en.className = 's';
    line.de.textContent = h.de;
    line.en.textContent = h.en || '⚠ not translated';
    history.push({ ...h, time: new Date(h.time) });
  }
  saveHistory();
  requestAnimationFrame(() => { for (const id in stick) $(id).scrollTop = $(id).scrollHeight; });
}

// ---------- Panes ----------
// Each sentence is a pair of paragraphs: one in the German pane, one in the English pane.
function makeLine() {
  const de = document.createElement('p');
  const en = document.createElement('p');
  de.className = 's live';
  en.className = 's live pending';
  $('feedDe').appendChild(de);
  $('feedEn').appendChild(en);
  document.body.classList.add('has-lines');
  return { de, en };
}

// Auto-scroll a pane only while the reader is at its bottom, so scrolling back to re-read isn't interrupted.
const stick = { feedDe: true, feedEn: true };
for (const id in stick) {
  $(id).addEventListener('scroll', () => { const m = $(id); stick[id] = m.scrollHeight - m.scrollTop - m.clientHeight < 40; });
}
function scrollDown() {
  for (const id in stick) if (stick[id]) $(id).scrollTop = $(id).scrollHeight;
}

async function finalize(de) {
  const line = liveEl || makeLine();
  liveEl = null;
  clearTimeout(liveTimer);
  line.de.classList.remove('live');
  line.en.classList.remove('live');
  line.de.textContent = de;
  if (!line.en.textContent) line.en.textContent = '…';
  const h = { de, en: '', raw: '', time: new Date() };
  history.push(h);
  scrollDown();
  try {
    h.raw = await translateRaw(de);
    h.en = toVariant(h.raw, variant);
    line.en.textContent = h.en;
  } catch (e) {
    line.en.textContent = '⚠ ' + e.message;
  }
  line.en.classList.remove('pending');
  saveHistory();
  scrollDown();
}

function showInterim(de) {
  if (!liveEl) liveEl = makeLine();
  liveEl.de.textContent = de;
  scrollDown();
  // Only translate partial speech with the on-device engine, to spare the online quota.
  if (engine !== 'builtin') return;
  clearTimeout(liveTimer);
  const line = liveEl;
  liveTimer = setTimeout(async () => {
    try { const en = await translate(de); if (line.en.classList.contains('live')) { line.en.textContent = en; scrollDown(); } } catch {}
  }, 250);
}

function dropLiveLine() {
  if (!liveEl) return;
  liveEl.de.remove();
  liveEl.en.remove();
  liveEl = null;
}

// ---------- Chunking ----------
// Speakers in lectures rarely pause, so the recognizer may not mark a sentence final for 20+ seconds.
// Instead of waiting, commit the older, already-stable words of the live text as their own line.
const CHUNK = 10;  // commit once this many uncommitted words are stable…
const HOLD = 4;    // …keeping the newest words live, since the recognizer may still revise them
const BREAK_BEFORE = new Set(['und', 'aber', 'oder', 'denn', 'sondern', 'dass', 'weil', 'wenn', 'als', 'ob', 'damit',
  'obwohl', 'während', 'also', 'deshalb', 'dann', 'doch', 'jedoch', 'sodass', 'bevor', 'nachdem', 'wobei']);
let committed = 0; // words of the current utterance already sent as lines
const words = t => t.split(/\s+/).filter(Boolean);

function onInterim(text) {
  const w = words(text);
  if (committed > w.length) committed = w.length;
  if (w.length - committed >= CHUNK + HOLD) {
    let cut = w.length - HOLD;
    // Prefer to split just before a conjunction so each chunk reads as a clause.
    for (let i = cut; i > committed + 5; i--) {
      if (BREAK_BEFORE.has(w[i].toLowerCase())) { cut = i; break; }
    }
    const chunk = w.slice(committed, cut).join(' ');
    committed = cut;
    finalize(chunk);
  }
  const rest = w.slice(committed).join(' ');
  if (rest) showInterim(rest);
}

function onFinal(text) {
  const w = words(text);
  const rest = w.slice(committed).join(' ');
  committed = Math.max(0, committed - w.length);
  if (rest) finalize(rest);
  else dropLiveLine();
}

// ---------- Speech recognition ----------
// Chrome ends a recognition session after silence, ~60s, or a network hiccup, and occasionally a
// session silently stops delivering results. A single state machine plus a watchdog keeps exactly
// one recognizer running for as long as the user is listening.
let recState = 'idle';          // 'idle' | 'starting' | 'active'
let lastEvent = 0, restartTimer = null, failStreak = 0, hadSession = false;
let startedAt = 0, clockTimer = null, wakeLock = null;

function makeRec() {
  const r = new SR();
  r.lang = 'de-DE';
  // Android Chrome duplicates results in continuous mode; use short sessions there instead.
  r.continuous = !isAndroid;
  r.interimResults = true;
  r.maxAlternatives = 1;
  const alive = () => { if (r === rec) lastEvent = Date.now(); };

  r.onstart = () => { if (r !== rec) return; recState = 'active'; hadSession = true; alive(); };
  r.onaudiostart = r.onspeechstart = alive;
  r.onresult = e => {
    if (r !== rec) return;
    alive();
    failStreak = 0;
    note('');
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) onFinal(res[0].transcript.trim());
      else interim += res[0].transcript;
    }
    if (interim.trim()) onInterim(interim.trim());
  };
  r.onerror = e => {
    if (r !== rec) return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      // Blocked on the very first start means no permission; later it can be a transient refusal.
      if (!hadSession || ++failStreak > 3) {
        note('Microphone access was blocked. Tap the 🔒 icon in the address bar, allow the microphone, then press the mic button again.');
        stop();
      }
    } else if (e.error === 'network') {
      failStreak++;
      note('Connection problem — reconnecting…');
    } else if (e.error === 'audio-capture') {
      failStreak++;
      note('No microphone input — is another app using the microphone?');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      failStreak++;
      note(`Speech recognition error (${e.error}) — retrying…`);
    }
  };
  r.onend = () => {
    if (r !== rec) return;
    recState = 'idle';
    // Keep an unfinished phrase rather than losing it when a session ends mid-sentence.
    if (liveEl) finalize(liveEl.de.textContent);
    committed = 0;
    if (listening) restart();
  };
  return r;
}

function launch() {
  recState = 'starting';
  lastEvent = Date.now();
  try { rec.start(); }
  catch { replaceRec(); }
}

// Throw away a stuck recognizer (ignoring its late events) and start a fresh one.
function replaceRec() {
  const old = rec;
  if (old) { old.onstart = old.onresult = old.onerror = old.onend = null; try { old.abort(); } catch {} }
  if (liveEl) finalize(liveEl.de.textContent);
  committed = 0;
  rec = makeRec();
  recState = 'idle';
  if (listening) restart();
}

function restart() {
  if (!listening || recState !== 'idle' || restartTimer) return;
  // Restart immediately after a normal session; back off if sessions keep failing.
  const delay = Math.min(failStreak * 500, 3000);
  restartTimer = setTimeout(() => {
    restartTimer = null;
    if (listening && recState === 'idle') launch();
  }, delay);
}

async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { console.warn('Wake lock failed:', e); }
}

function tick() {
  const sec = Math.floor((Date.now() - startedAt) / 1000);
  const t = `${Math.floor(sec / 3600)}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  setStatus(recState === 'active' ? `Listening · ${t}` : `Reconnecting… · ${t}`);
  // Watchdog
  const quiet = Date.now() - lastEvent;
  if (recState === 'idle') restart();
  else if (recState === 'starting' && quiet > 5000) replaceRec();
  else if (recState === 'active' && quiet > 8000) replaceRec(); // no results for a while: session may be stuck
}

function start() {
  note('');
  listening = true;
  failStreak = 0;
  hadSession = false;
  committed = 0;
  startedAt = Date.now();
  $('toggle').classList.add('on');
  document.body.classList.add('listening');
  $('toggle').setAttribute('aria-label', 'Stop listening');
  rec = makeRec();
  launch();
  keepAwake();
  clockTimer = setInterval(tick, 1000);
  tick();
  if (!translator) initTranslator(true);
}
function stop() {
  listening = false;
  clearInterval(clockTimer);
  clearTimeout(restartTimer);
  restartTimer = null;
  try { rec && rec.stop(); } catch {}
  recState = 'idle';
  try { wakeLock && wakeLock.release(); } catch {}
  wakeLock = null;
  $('toggle').classList.remove('on');
  document.body.classList.remove('listening');
  $('toggle').setAttribute('aria-label', 'Start listening');
  setStatus('Press and start talking');
}

// Wake locks are dropped when the tab is hidden; re-acquire and resume when it's visible again.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && listening) { keepAwake(); tick(); }
});

// ---------- Two-way conversation ----------
// Browsers recognise one language per session, so each side taps their own button before speaking.
const chat = [];              // {from: 'de'|'en', orig, raw, tr, time}
const chatEls = new Map();    // chat entry -> its DOM parts
let talkRec = null, speakOn = store.get('lt-speak', '1') === '1';
const isTalk = () => document.body.dataset.mode === 'talk';

function updateHasLines() {
  document.body.classList.toggle('has-lines', isTalk() ? chat.length > 0 : !!(history.length || liveEl));
  $('count').textContent = isTalk()
    ? (chat.length ? `· ${chat.length} message${chat.length === 1 ? '' : 's'}` : '')
    : (history.length ? `· ${history.length} sentence${history.length === 1 ? '' : 's'}` : '');
}

const REPLAY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
function addMsg(from) {
  const el = document.createElement('div');
  el.className = `msg ${from} live pending`;
  const flag = from === 'de' ? document.querySelector('.tmic.de .badge').innerHTML : document.querySelector('.tmic.en .badge').innerHTML;
  el.innerHTML = `<div class="who">${flag}<span></span><button class="replay" title="Read aloud" aria-label="Read aloud" hidden>${REPLAY_SVG}</button></div><div class="tr"></div><div class="orig"></div>`;
  el.querySelector('.who span').textContent = from === 'de' ? 'German speaker' : 'You';
  $('chat').appendChild(el);
  document.body.classList.add('has-lines');
  return { el, tr: el.querySelector('.tr'), orig: el.querySelector('.orig'), replay: el.querySelector('.replay') };
}
function scrollChat() { const c = $('chat'); c.scrollTop = c.scrollHeight; }

const voiceLang = lang => lang === 'de' ? 'de-DE' : `en-${variant}`;
function speak(text, lang) {
  if (!('speechSynthesis' in self) || !text || text.startsWith('⚠')) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voiceLang(lang);
  const voices = speechSynthesis.getVoices();
  u.voice = voices.find(v => v.lang.replace('_', '-') === u.lang) || voices.find(v => v.lang.startsWith(lang)) || null;
  speechSynthesis.speak(u);
}

async function finishMsg(parts, from, text) {
  const to = from === 'de' ? 'en' : 'de';
  const m = { from, orig: text, raw: '', tr: '', time: new Date() };
  chat.push(m);
  chatEls.set(m, parts);
  parts.el.classList.remove('live');
  parts.orig.textContent = text;
  parts.tr.textContent = '…';
  updateHasLines();
  try {
    m.raw = await translateRaw(text, from, to);
    m.tr = to === 'en' ? toVariant(m.raw, variant) : m.raw;
    parts.tr.textContent = m.tr;
    parts.replay.hidden = false;
    parts.replay.onclick = () => speak(m.tr, to);
    if (speakOn) speak(m.tr, to);
  } catch (e) {
    parts.tr.textContent = '⚠ ' + e.message;
  }
  parts.el.classList.remove('pending');
  saveChat();
  scrollChat();
}

function renderMsg(m) {
  const parts = addMsg(m.from);
  parts.el.classList.remove('live', 'pending');
  parts.tr.textContent = m.tr || '⚠ not translated';
  parts.orig.textContent = m.orig;
  if (m.tr) { parts.replay.hidden = false; parts.replay.onclick = () => speak(m.tr, m.from === 'de' ? 'en' : 'de'); }
  chatEls.set(m, parts);
}
function saveChat() {
  updateHasLines();
  store.set('lt-chat', JSON.stringify(chat));
}
function restoreChat() {
  let saved = [];
  try { saved = JSON.parse(store.get('lt-chat', '[]')); } catch {}
  for (const m of saved) { m.time = new Date(m.time); chat.push(m); renderMsg(m); }
  requestAnimationFrame(scrollChat);
}

function setTalkUI() {
  for (const [id, lang] of [['talkDe', 'de'], ['talkEn', 'en']]) {
    $(id).classList.toggle('on', talkRec?.from === lang);
  }
  if (isTalk()) setStatus(!talkRec ? 'Tap a flag, then speak' : talkRec.from === 'de' ? 'Listening for German…' : 'Listening for English…');
}

function talk(from) {
  const cur = talkRec;
  if (cur) {
    // Tapping the active button ends the turn early; tapping the other one hands over.
    talkRec = null;
    cur.stop();
    setTalkUI();
    if (cur.from === from) return;
  }
  if (listening) stop();
  // iOS only allows speech output that starts from a tap, so unlock it now for the reply later.
  if ('speechSynthesis' in self) { speechSynthesis.cancel(); if (speakOn) speechSynthesis.speak(new SpeechSynthesisUtterance('')); }
  keepAwake();
  note('');

  const r = new SR();
  r.from = from;
  r.lang = voiceLang(from);
  r.continuous = false;
  r.interimResults = true;
  let parts = null, text = '';
  r.onresult = e => {
    text = [...e.results].map(x => x[0].transcript).join('').trim();
    if (!text) return;
    if (!parts) parts = addMsg(from);
    parts.orig.textContent = text;
    scrollChat();
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      note('Microphone access was blocked. Tap the 🔒 icon in the address bar, allow the microphone, then try again.');
    } else if (e.error === 'no-speech') {
      note('Didn\u2019t catch that — tap the button and speak again.');
    } else if (e.error !== 'aborted') {
      note(`Speech recognition error (${e.error}) — please try again.`);
    }
  };
  r.onend = () => {
    if (talkRec === r) { talkRec = null; setTalkUI(); }
    if (text) finishMsg(parts, from, text);
    else if (parts) parts.el.remove();
  };
  talkRec = r;
  setTalkUI();
  try { r.start(); } catch { talkRec = null; setTalkUI(); }
}

$('talkDe').onclick = () => talk('de');
$('talkEn').onclick = () => talk('en');
$('speak').onclick = () => {
  speakOn = !speakOn;
  $('speak').setAttribute('aria-pressed', speakOn);
  store.set('lt-speak', speakOn ? '1' : '0');
  if (!speakOn && 'speechSynthesis' in self) speechSynthesis.cancel();
};

// ---------- Controls ----------
$('toggle').onclick = () => listening ? stop() : start();
$('settings').onclick = () => { $('gkey').value = googleKey; $('email').value = quotaEmail; $('dlg').showModal(); };
$('dlg').addEventListener('close', () => {
  if ($('dlg').returnValue !== 'save') return;
  googleKey = $('gkey').value.trim(); quotaEmail = $('email').value.trim();
  store.set('lt-gkey', googleKey); store.set('lt-email', quotaEmail);
  cache.clear();
  showEngine();
});
$('clear').onclick = () => {
  if (isTalk()) {
    if (chat.length && !confirm('Clear the whole conversation?')) return;
    $('chat').innerHTML = ''; chat.length = 0; chatEls.clear(); saveChat();
    return;
  }
  if (history.length && !confirm('Clear the whole transcript?')) return;
  $('feedDe').innerHTML = $('feedEn').innerHTML = ''; history.length = 0; liveEl = null; saveHistory();
};
function setSize(v) {
  document.body.style.setProperty('--size', v);
  for (const b of $('size').children) b.setAttribute('aria-pressed', b.dataset.size === v);
}
function setMode(m) {
  const wasTalk = isTalk();
  document.body.dataset.mode = m;
  for (const b of $('mode').children) b.setAttribute('aria-pressed', b.dataset.mode === m);
  if (m === 'talk') {
    if (listening) stop();
    setTalkUI();
  } else if (wasTalk) {
    if (talkRec) { const r = talkRec; talkRec = null; r.abort(); }
    setTalkUI();
    setStatus('Press and start talking');
    try { wakeLock && wakeLock.release(); } catch {}
    wakeLock = null;
  }
  updateHasLines();
}
$('size').onclick = e => { const b = e.target.closest('button'); if (b) { setSize(b.dataset.size); store.set('lt-size', b.dataset.size); } };
document.querySelectorAll('.variant').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { setVariant(b.dataset.v); store.set('lt-variant', b.dataset.v); }
}));
$('mode').onclick = e => { const b = e.target.closest('button'); if (b) { setMode(b.dataset.mode); store.set('lt-mode', b.dataset.mode); } };
$('save').onclick = () => {
  let txt;
  if (isTalk()) {
    if (!chat.length) return;
    txt = chat.map(m => `[${m.time.toLocaleTimeString()}] ${m.from === 'de' ? 'German speaker' : 'You'}\n${m.from.toUpperCase()}: ${m.orig}\n${m.from === 'de' ? 'EN' : 'DE'}: ${m.tr}\n`).join('\n');
  } else {
    if (!history.length) return;
    txt = history.map(h => `[${h.time.toLocaleTimeString()}]\nDE: ${h.de}\nEN: ${h.en}\n`).join('\n');
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = `transcript-${new Date().toISOString().slice(0, 16).replace(':', '-')}.txt`;
  a.click();
};
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !isTalk() && !['SELECT', 'INPUT', 'BUTTON'].includes(e.target.tagName) && !$('dlg').open) { e.preventDefault(); $('toggle').click(); }
});

setSize(store.get('lt-size', '22px'));
$('speak').setAttribute('aria-pressed', speakOn);
restoreHistory();
restoreChat();
setMode(store.get('lt-mode', 'both'));
setVariant(variant);

if (!SR) {
  note('This browser does not support live speech recognition. Please open this page in <b>Chrome</b>, <b>Edge</b>, or <b>Safari</b>.');
  $('toggle').disabled = $('talkDe').disabled = $('talkEn').disabled = true;
}
showEngine();
initTranslator();
</script>
</body>
</html>
