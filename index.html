<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Übersetzer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1b1b1f; --muted: #6b6b76;
    --border: #e3e1dc; --accent: #d93a2b; --accent-soft: #fbe7e4; --ok: #1f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121215; --panel: #1b1b20; --text: #ececf1; --muted: #9a9aa6;
      --border: #2c2c33; --accent: #ff5a47; --accent-soft: #3a1d1a; --ok: #4ccf86;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121215; --panel: #1b1b20; --text: #ececf1; --muted: #9a9aa6;
    --border: #2c2c33; --accent: #ff5a47; --accent-soft: #3a1d1a; --ok: #4ccf86;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  h1 span { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .listening .dot { background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  button, select {
    font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  #toggle { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; min-width: 110px; }
  #toggle.on { background: var(--panel); color: var(--accent); }

  main { flex: 1; overflow-y: auto; padding: 16px; }
  .feed { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .line { border-left: 3px solid var(--border); padding: 2px 0 2px 14px; }
  .line.live { border-color: var(--accent); }
  .en { font-size: var(--size, 26px); line-height: 1.35; font-weight: 500; }
  .de { font-size: calc(var(--size, 26px) * .6); color: var(--muted); margin-top: 2px; }
  body.hide-de .de { display: none; }
  .live .en { opacity: .75; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; max-width: 520px; margin-inline: auto; }
  .empty b { color: var(--text); }
  .note {
    max-width: 900px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 8px;
    background: var(--accent-soft); font-size: 14px; display: none;
  }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); width: min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { font-size: 17px; margin: 0 0 12px; }
  dialog label { display: block; margin-bottom: 14px; font-size: 14px; }
  dialog small { color: var(--muted); }
  dialog input { display: block; width: 100%; margin-top: 4px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
  footer {
    padding: 8px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);
    background: var(--panel); display: flex; gap: 12px; flex-wrap: wrap;
  }
  @media (max-width: 600px) {
    header { gap: 8px; }
    .status { order: 5; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Live Übersetzer <span>Deutsch → English</span></h1>
  <div class="spacer"></div>
  <select id="size" title="Text size">
    <option value="20px">Small</option>
    <option value="26px" selected>Medium</option>
    <option value="34px">Large</option>
    <option value="44px">XL</option>
  </select>
  <button id="showDe" title="Show/hide the German original">Hide German</button>
  <button id="save" title="Download transcript">Save</button>
  <button id="settings" title="Translation settings">Settings</button>
  <button id="clear">Clear</button>
  <button id="toggle">▶ Start</button>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Idle</span></div>
</header>

<main id="main">
  <div class="note" id="note"></div>
  <div class="feed" id="feed">
    <div class="empty" id="empty">
      Press <b>Start</b> and allow microphone access.<br>
      German speech appears here, translated into English as it's spoken.
    </div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog">
    <h2>Translation settings</h2>
    <label>Google Translate API key <small>(recommended for long classes — free tier covers ~500,000 characters/month)</small>
      <input id="gkey" type="password" autocomplete="off" placeholder="AIza…"></label>
    <label>Email for MyMemory <small>(used when no key is set — raises the free limit from 5,000 to 50,000 characters/day)</small>
      <input id="email" type="email" autocomplete="off" placeholder="you@example.com"></label>
    <p><small>Saved only in this browser.</small></p>
    <div class="row"><button value="cancel">Cancel</button><button value="save">Save</button></div>
  </form>
</dialog>

<footer>
  <span>Engine: <b id="engine">checking…</b></span>
  <span id="count"></span>
</footer>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isAndroid = /Android/i.test(navigator.userAgent);
const store = {
  get(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let quotaEmail = store.get('lt-email'), googleKey = store.get('lt-gkey');

let listening = false, rec = null, liveEl = null, liveTimer = null;
let translator = null, engine = 'mymemory';
const history = []; // {de, en, time}

function note(msg) { $('note').innerHTML = msg; $('note').style.display = msg ? 'block' : 'none'; }
function setStatus(t) { $('statusText').textContent = t; }

// ---------- Translation ----------
// Prefer Chrome's built-in on-device Translator (fast, free, unlimited);
// fall back to the MyMemory web API (free, ~5000 chars/day).
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

// fromGesture: creating a translator that needs a download requires a user click.
async function initTranslator(fromGesture = false) {
  if ('Translator' in self && !translator) {
    try {
      const avail = await withTimeout(Translator.availability({ sourceLanguage: 'de', targetLanguage: 'en' }), 3000);
      if (avail === 'available' || (fromGesture && avail !== 'unavailable')) {
        translator = await Translator.create({
          sourceLanguage: 'de', targetLanguage: 'en',
          monitor(m) { m.addEventListener('downloadprogress', e => setStatus(`Downloading language pack ${Math.round(e.loaded * 100)}%`)); }
        });
        engine = 'builtin';
      }
    } catch (e) { console.warn('Built-in translator unavailable:', e); }
  }
  showEngine();
}
function showEngine() {
  $('engine').textContent = engine === 'builtin' ? 'Chrome on-device translator'
    : googleKey ? 'Google Translate API'
    : 'MyMemory online API (small free daily limit — see Settings)';
}

const cache = new Map();
async function translate(text) {
  text = text.trim();
  if (!text) return '';
  if (cache.has(text)) return cache.get(text);
  let out;
  if (engine === 'builtin') {
    out = await translator.translate(text);
  } else if (googleKey) {
    const r = await fetch('https://translation.googleapis.com/language/translate/v2?key=' + encodeURIComponent(googleKey), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text, source: 'de', target: 'en', format: 'text' }),
    });
    const j = await r.json();
    if (j.error) throw new Error('Google: ' + j.error.message);
    out = j.data.translations[0].translatedText;
  } else {
    const url = 'https://api.mymemory.translated.net/get?langpair=de|en&q=' + encodeURIComponent(text.slice(0, 480))
      + (quotaEmail ? '&de=' + encodeURIComponent(quotaEmail) : '');
    const r = await fetch(url);
    const j = await r.json();
    if (j.quotaFinished) throw new Error('Daily free translation limit reached — add a Google key in Settings');
    if (j.responseStatus != 200) throw new Error(j.responseDetails || 'Translation failed');
    out = j.responseData.translatedText;
  }
  cache.set(text, out);
  return out;
}

// ---------- Transcript ----------
function saveHistory() {
  $('count').textContent = history.length ? history.length + ' sentences' : '';
  store.set('lt-history', JSON.stringify(history));
}
function restoreHistory() {
  let saved = [];
  try { saved = JSON.parse(store.get('lt-history', '[]')); } catch {}
  for (const h of saved) {
    const el = makeLine();
    el.classList.remove('live');
    el.querySelector('.en').textContent = h.en || '⚠ not translated';
    el.querySelector('.de').textContent = h.de;
    history.push({ ...h, time: new Date(h.time) });
  }
  saveHistory();
  $('main').scrollTop = $('main').scrollHeight;
}

// ---------- UI lines ----------
function makeLine() {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'line live';
  el.innerHTML = '<div class="en"></div><div class="de"></div>';
  $('feed').appendChild(el);
  return el;
}
function scrollDown() {
  const m = $('main');
  if (m.scrollHeight - m.scrollTop - m.clientHeight < 250) m.scrollTop = m.scrollHeight;
}

async function finalize(de) {
  const el = liveEl || makeLine();
  liveEl = null;
  clearTimeout(liveTimer);
  el.classList.remove('live');
  el.querySelector('.de').textContent = de;
  el.querySelector('.en').textContent = el.querySelector('.en').textContent || '…';
  scrollDown();
  try {
    const en = await translate(de);
    el.querySelector('.en').textContent = en;
    history.push({ de, en, time: new Date() });
  } catch (e) {
    el.querySelector('.en').textContent = '⚠ ' + e.message;
    history.push({ de, en: '', time: new Date() });
  }
  saveHistory();
  scrollDown();
}

function showInterim(de) {
  if (!liveEl) liveEl = makeLine();
  liveEl.querySelector('.de').textContent = de;
  scrollDown();
  // Only translate partial speech with the on-device engine, to spare the online quota.
  if (engine !== 'builtin') return;
  clearTimeout(liveTimer);
  const el = liveEl;
  liveTimer = setTimeout(async () => {
    try { const en = await translate(de); if (el.classList.contains('live')) el.querySelector('.en').textContent = en; } catch {}
  }, 250);
}

// ---------- Speech recognition ----------
// Chrome ends a recognition session after silence, ~60s, or a network hiccup.
// For hour-long listening we restart on every end, plus a watchdog in case an end is missed.
let recActive = false, lastRestart = 0, startedAt = 0, clockTimer = null, wakeLock = null;

function makeRec() {
  const r = new SR();
  r.lang = 'de-DE';
  // Android Chrome duplicates results in continuous mode; use short sessions there instead.
  r.continuous = !isAndroid;
  r.interimResults = true;

  r.onstart = () => { recActive = true; };
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) { if (res[0].transcript.trim()) finalize(res[0].transcript.trim()); }
      else interim += res[0].transcript;
    }
    if (interim.trim()) showInterim(interim.trim());
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      note('Microphone access was blocked. Tap the 🔒 icon in the address bar, allow the microphone, then press Start again.');
      stop();
    } else if (e.error === 'network') {
      note('Connection problem — retrying automatically…');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      console.warn('Recognition error:', e.error);
    }
  };
  r.onend = () => {
    recActive = false;
    // Keep an unfinished sentence rather than losing it when a session ends mid-phrase.
    if (liveEl) finalize(liveEl.querySelector('.de').textContent);
    if (listening) restart();
  };
  return r;
}

function restart() {
  if (!listening || recActive) return;
  const wait = Math.max(0, 300 - (Date.now() - lastRestart));
  setTimeout(() => {
    if (!listening || recActive) return;
    lastRestart = Date.now();
    try { rec.start(); }
    catch { rec = makeRec(); try { rec.start(); } catch {} }
  }, wait);
}

async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { console.warn('Wake lock failed:', e); }
}

function tick() {
  const sec = Math.floor((Date.now() - startedAt) / 1000);
  const t = `${Math.floor(sec / 3600)}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  setStatus(`Listening · ${t}`);
  if (!recActive && Date.now() - lastRestart > 4000) restart(); // watchdog
}

function start() {
  note('');
  listening = true;
  startedAt = Date.now();
  $('toggle').textContent = '■ Stop';
  $('toggle').classList.add('on');
  $('status').classList.add('listening');
  rec = makeRec();
  lastRestart = Date.now();
  rec.start();
  keepAwake();
  clockTimer = setInterval(tick, 1000);
  tick();
  if (!translator) initTranslator(true);
}
function stop() {
  listening = false;
  clearInterval(clockTimer);
  try { rec && rec.stop(); } catch {}
  try { wakeLock && wakeLock.release(); } catch {}
  wakeLock = null;
  $('toggle').textContent = '▶ Start';
  $('toggle').classList.remove('on');
  $('status').classList.remove('listening');
  setStatus('Idle');
}

// Wake locks are dropped when the tab is hidden; re-acquire and resume when it's visible again.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && listening) { keepAwake(); restart(); }
});

// ---------- Controls ----------
$('toggle').onclick = () => listening ? stop() : start();
$('settings').onclick = () => { $('gkey').value = googleKey; $('email').value = quotaEmail; $('dlg').showModal(); };
$('dlg').addEventListener('close', () => {
  if ($('dlg').returnValue !== 'save') return;
  googleKey = $('gkey').value.trim(); quotaEmail = $('email').value.trim();
  store.set('lt-gkey', googleKey); store.set('lt-email', quotaEmail);
  cache.clear();
  showEngine();
});
$('clear').onclick = () => {
  if (history.length && !confirm('Clear the whole transcript?')) return;
  $('feed').innerHTML = ''; history.length = 0; liveEl = null; saveHistory();
};
$('size').onchange = e => { document.body.style.setProperty('--size', e.target.value); store.set('lt-size', e.target.value); };
$('showDe').onclick = () => {
  const hidden = document.body.classList.toggle('hide-de');
  $('showDe').textContent = hidden ? 'Show German' : 'Hide German';
};
$('save').onclick = () => {
  if (!history.length) return;
  const txt = history.map(h => `[${h.time.toLocaleTimeString()}]\nDE: ${h.de}\nEN: ${h.en}\n`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = `transcript-${new Date().toISOString().slice(0, 16).replace(':', '-')}.txt`;
  a.click();
};
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !['SELECT', 'INPUT', 'BUTTON'].includes(e.target.tagName) && !$('dlg').open) { e.preventDefault(); $('toggle').click(); }
});

const savedSize = store.get('lt-size');
if (savedSize) { $('size').value = savedSize; document.body.style.setProperty('--size', savedSize); }
restoreHistory();

if (!SR) {
  note('This browser does not support live speech recognition. Please open this page in <b>Chrome</b>, <b>Edge</b>, or <b>Safari</b>.');
  $('toggle').disabled = true;
}
initTranslator();
</script>
</body>
</html>
